<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Media | jajm2006.uk</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#0d0d0f; --ink-2:#141418; --ink-3:#1c1c22; --ink-4:#252530;
      --rule:#2e2e3a; --rule-2:#3d3d50; --dim:#5a5a72; --muted:#8585a0;
      --body:#c8c8d8; --head:#e8e8f0; --bright:#f4f4f8;
      --accent:#a89f6e; --accent-2:#c4b98a; --accent-dim:#3a3520;
    }
    [data-theme="light"] {
      --ink:#f5f0e8; --ink-2:#ede8de; --ink-3:#e4ddd2; --ink-4:#d8d0c3;
      --rule:#c8bfaf; --rule-2:#b0a590; --dim:#7a6e5a; --muted:#5a5040;
      --body:#3a3020; --head:#1a1208; --bright:#0d0800;
      --accent:#7a6e3a; --accent-2:#5a5020; --accent-dim:#e8e0c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--ink); color: var(--body);
      font-family: 'EB Garamond', Georgia, serif; font-size: 1.05rem;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .label { font-family: 'JetBrains Mono', monospace; font-size: .68em; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    a { color: var(--accent-2); }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--rule);
    }
    header a.brand { color: var(--head); text-decoration: none; font-size: 1.1rem; }
    .theme-toggle {
      background: none; border: 1px solid var(--rule-2); color: var(--head);
      border-radius: 50%; width: 2.1rem; height: 2.1rem; cursor: pointer; font-size: 1rem;
    }
    main { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }
    h1 { color: var(--head); font-weight: 400; margin: 0 0 .35rem; }
    .sub { color: var(--dim); font-size: .8em; margin-bottom: 2.5rem; }

    .gate {
      max-width: 380px; margin: 4rem auto 0; text-align: center;
    }
    .gate input {
      width: 100%; padding: .75rem .9rem; background: var(--ink-2);
      border: 1px solid var(--rule-2); color: var(--bright); border-radius: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: .9em; margin-top: 1rem;
    }
    .gate button {
      width: 100%; margin-top: 1rem; padding: .75rem .9rem; border-radius: 6px;
      border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent-2);
      font-family: 'JetBrains Mono', monospace; font-size: .82em; letter-spacing: .05em;
      cursor: pointer; text-transform: uppercase;
    }
    .gate button:hover { background: var(--accent); color: var(--ink); }
    .error { color: #d98a8a; font-size: .8em; margin-top: .75rem; min-height: 1.2em; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem; margin-top: 1.5rem;
    }
    .tile {
      border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
      background: var(--ink-2); cursor: pointer; aspect-ratio: 1 / 1; position: relative;
    }
    .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .kind {
      position: absolute; top: .4rem; right: .4rem; background: rgba(0,0,0,.55);
      color: #fff; font-size: .65em; padding: .15rem .4rem; border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .empty { color: var(--dim); font-size: .9em; text-align: center; margin-top: 3rem; }

    .lightbox {
      position: fixed; inset: 0; background: rgba(5,5,8,.94); display: none;
      align-items: center; justify-content: center; z-index: 50; padding: 2rem;
    }
    .lightbox.open { display: flex; }
    .lightbox img, .lightbox video { max-width: 100%; max-height: 100%; border-radius: 6px; }
    .lightbox .close {
      position: absolute; top: 1.25rem; right: 1.5rem; background: none; border: none;
      color: #fff; font-size: 1.8rem; cursor: pointer; line-height: 1;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">jajm2006.uk</a>
    <button class="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">☀︎</button>
  </header>

  <main>
    <div id="gate-view" class="gate hidden">
      <div class="label">Private gallery</div>
      <h1 id="gate-title" style="margin-top:.5rem;">This gallery is password protected</h1>
      <input id="password-input" type="password" placeholder="Password" autocomplete="off" />
      <button id="unlock-btn" onclick="attemptUnlock()">Unlock</button>
      <div class="error" id="gate-error"></div>
    </div>

    <div id="empty-view" class="empty hidden">
      <p>Nothing to see here directly — you'll need a link to a specific gallery.</p>
    </div>

    <div id="gallery-view" class="hidden">
      <div class="label">Private gallery</div>
      <h1 id="gallery-title" style="margin-top:.5rem;"></h1>
      <div class="sub mono" id="gallery-count"></div>
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <div class="lightbox" id="lightbox">
    <button class="close" onclick="closeLightbox()">&times;</button>
    <div id="lightbox-content"></div>
  </div>

  <script>
    // ---- theme (shared convention with rest of site) ----
    const root = document.documentElement;
    function getSystemTheme() { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = theme === 'dark' ? '☀︎' : '☽');
      localStorage.setItem('theme', theme);
    }
    function toggleTheme() { applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); }
    applyTheme(localStorage.getItem('theme') || getSystemTheme());

    // ---- figure out which gallery this URL is for ----
    function currentGalleryId() {
      const parts = location.pathname.split('/').filter(Boolean); // e.g. ["media","summer-2026"]
      if (parts.length < 2) return '';
      return decodeURIComponent(parts[1]);
    }
    const galleryId = currentGalleryId();

    function show(id) {
      ['gate-view', 'empty-view', 'gallery-view'].forEach(v => {
        document.getElementById(v).classList.toggle('hidden', v !== id);
      });
    }

    function fileKind(key) {
      const ext = key.split('.').pop().toLowerCase();
      return ['mp4','mov','webm','mkv','m4v','avi'].includes(ext) ? 'video' : 'image';
    }

    async function loadGallery() {
      const res = await fetch(`/api/media/list?gallery=${encodeURIComponent(galleryId)}`, { credentials: 'same-origin' });
      if (res.status === 401) { show('gate-view'); return; }
      if (!res.ok) { show('gate-view'); document.getElementById('gate-error').textContent = 'Something went wrong loading this gallery.'; return; }
      const data = await res.json();
      renderGallery(data);
    }

    function renderGallery(data) {
      document.getElementById('gallery-title').textContent = data.name;
      document.getElementById('gallery-count').textContent = `${data.files.length} item${data.files.length === 1 ? '' : 's'}`;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      data.files.forEach(f => {
        const kind = fileKind(f.key);
        const url = `/api/media/file/${encodeURIComponent(galleryId)}/${encodeURIComponent(f.key)}`;
        const tile = document.createElement('div');
        tile.className = 'tile';
        if (kind === 'image') {
          tile.innerHTML = `<img src="${url}" loading="lazy" alt="">`;
        } else {
          tile.innerHTML = `<video src="${url}#t=0.5" preload="metadata" muted></video><span class="kind">▶ video</span>`;
        }
        tile.onclick = () => openLightbox(url, kind);
        grid.appendChild(tile);
      });
      show('gallery-view');
    }

    function openLightbox(url, kind) {
      const content = document.getElementById('lightbox-content');
      content.innerHTML = kind === 'image'
        ? `<img src="${url}" alt="">`
        : `<video src="${url}" controls autoplay></video>`;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightbox-content').innerHTML = '';
    }
    document.getElementById('lightbox').addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();
    });

    async function attemptUnlock() {
      const input = document.getElementById('password-input');
      const errorEl = document.getElementById('gate-error');
      errorEl.textContent = '';
      const btn = document.getElementById('unlock-btn');
      btn.disabled = true;
      try {
        const res = await fetch('/api/media/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ gallery: galleryId, password: input.value }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          errorEl.textContent = err.error || 'Incorrect password.';
          btn.disabled = false;
          return;
        }
        await loadGallery();
      } catch {
        errorEl.textContent = 'Network error — try again.';
      }
      btn.disabled = false;
    }
    document.getElementById('password-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') attemptUnlock();
    });

    // ---- boot ----
    if (!galleryId) {
      show('empty-view');
    } else {
      loadGallery();
    }
  </script>
</body>
</html>

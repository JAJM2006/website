<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Media Admin | jajm2006.uk</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:#0d0d0f; --ink-2:#141418; --ink-3:#1c1c22; --ink-4:#252530;
      --rule:#2e2e3a; --rule-2:#3d3d50; --dim:#5a5a72; --muted:#8585a0;
      --body:#c8c8d8; --head:#e8e8f0; --bright:#f4f4f8;
      --accent:#a89f6e; --accent-2:#c4b98a; --accent-dim:#3a3520;
    }
    [data-theme="light"] {
      --ink:#f5f0e8; --ink-2:#ede8de; --ink-3:#e4ddd2; --ink-4:#d8d0c3;
      --rule:#c8bfaf; --rule-2:#b0a590; --dim:#7a6e5a; --muted:#5a5040;
      --body:#3a3020; --head:#1a1208; --bright:#0d0800;
      --accent:#7a6e3a; --accent-2:#5a5020; --accent-dim:#e8e0c0;
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--ink); color:var(--body); font-family:'EB Garamond', Georgia, serif; }
    .mono { font-family:'JetBrains Mono', monospace; }
    .label { font-family:'JetBrains Mono', monospace; font-size:.68em; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
    header { display:flex; justify-content:space-between; align-items:center; padding:1.25rem 1.5rem; border-bottom:1px solid var(--rule); }
    header a { color:var(--head); text-decoration:none; font-size:1.1rem; }
    main { max-width:760px; margin:0 auto; padding:3rem 1.5rem 5rem; }
    h1 { color:var(--head); font-weight:400; }
    h2 { color:var(--head); font-weight:400; font-size:1.15rem; border-bottom:1px solid var(--rule); padding-bottom:.5rem; margin-top:3rem; }
    input, button {
      font-family:'JetBrains Mono', monospace; font-size:.85em; border-radius:6px;
    }
    input {
      width:100%; padding:.65rem .8rem; background:var(--ink-2); border:1px solid var(--rule-2); color:var(--bright); margin-top:.6rem;
    }
    button {
      padding:.6rem 1rem; border:1px solid var(--accent); background:var(--accent-dim); color:var(--accent-2);
      cursor:pointer; text-transform:uppercase; letter-spacing:.04em; margin-top:.8rem;
    }
    button:hover { background:var(--accent); color:var(--ink); }
    button.danger { border-color:#a85a5a; background:#2a1414; color:#d98a8a; }
    button.danger:hover { background:#a85a5a; color:var(--ink); }
    button.small { padding:.3rem .6rem; font-size:.75em; margin-top:0; }
    .error { color:#d98a8a; font-size:.8em; margin-top:.6rem; min-height:1.1em; }
    .ok { color:#8ad9a0; font-size:.8em; margin-top:.6rem; min-height:1.1em; }
    .gate { max-width:340px; margin:5rem auto 0; text-align:center; }

    .gallery-card {
      border:1px solid var(--rule); border-radius:8px; padding:1rem 1.25rem; margin-top:1rem;
    }
    .gallery-card .row { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap; }
    .gallery-card .name { color:var(--head); font-size:1.05rem; }
    .gallery-card .meta { color:var(--dim); font-size:.75em; }
    .gallery-card .link { color:var(--accent-2); font-size:.75em; word-break:break-all; }
    .gallery-card .actions { display:flex; gap:.5rem; }

    .file-row { display:flex; justify-content:space-between; align-items:center; padding:.4rem 0; border-bottom:1px solid var(--rule); font-size:.85em; }
    .file-row:last-child { border-bottom:none; }
    .progress-wrap { margin-top:.75rem; }
    .progress-bar { height:6px; background:var(--ink-3); border-radius:3px; overflow:hidden; margin-top:.3rem; }
    .progress-fill { height:100%; background:var(--accent); width:0%; transition:width .15s; }
    .file-progress-name { font-size:.75em; color:var(--dim); }
    details { margin-top:.75rem; }
    details summary { cursor:pointer; color:var(--accent-2); font-size:.8em; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <header>
    <a href="/">jajm2006.uk</a>
    <span class="label">Admin</span>
  </header>

  <main>
    <div id="gate-view" class="gate">
      <div class="label">Restricted</div>
      <h1>Media Admin</h1>
      <input id="admin-password" type="password" placeholder="Admin password" autocomplete="off" />
      <button onclick="adminLogin()">Log in</button>
      <div class="error" id="gate-error"></div>
    </div>

    <div id="panel-view" class="hidden">
      <h1>Media Admin</h1>
      <p class="mono" style="color:var(--dim); font-size:.8em;">Create a gallery, set its password, and upload files. Share the gallery link with whoever needs it — they'll be asked for that gallery's password only.</p>

      <h2>New gallery</h2>
      <input id="new-name" placeholder="Gallery name (e.g. Summer 2026)" />
      <input id="new-password" type="password" placeholder="Gallery password" autocomplete="off" />
      <button onclick="createGallery()">Create gallery</button>
      <div class="error" id="create-error"></div>
      <div class="ok" id="create-ok"></div>

      <h2>Existing galleries</h2>
      <div id="galleries"></div>
    </div>
  </main>

  <script>
    async function adminLogin() {
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('gate-error');
      errorEl.textContent = '';
      const res = await fetch('/api/admin/login', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        errorEl.textContent = err.error || 'Incorrect password.';
        return;
      }
      showPanel();
    }

    async function showPanel() {
      document.getElementById('gate-view').classList.add('hidden');
      document.getElementById('panel-view').classList.remove('hidden');
      await refreshGalleries();
    }

    async function checkExistingSession() {
      const res = await fetch('/api/admin/galleries', { credentials: 'same-origin' });
      if (res.ok) showPanel();
    }

    async function createGallery() {
      const name = document.getElementById('new-name').value.trim();
      const password = document.getElementById('new-password').value;
      const errorEl = document.getElementById('create-error');
      const okEl = document.getElementById('create-ok');
      errorEl.textContent = ''; okEl.textContent = '';
      const res = await fetch('/api/admin/galleries', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { errorEl.textContent = data.error || 'Could not create gallery.'; return; }
      document.getElementById('new-name').value = '';
      document.getElementById('new-password').value = '';
      okEl.textContent = `Created — share link: /media/${data.id}/`;
      await refreshGalleries();
    }

    async function refreshGalleries() {
      const res = await fetch('/api/admin/galleries', { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      const container = document.getElementById('galleries');
      container.innerHTML = '';
      if (!data.galleries.length) {
        container.innerHTML = '<p class="mono" style="color:var(--dim); font-size:.85em;">No galleries yet.</p>';
        return;
      }
      data.galleries.forEach(g => container.appendChild(renderGalleryCard(g)));
    }

    function renderGalleryCard(g) {
      const card = document.createElement('div');
      card.className = 'gallery-card';
      const shareUrl = `${location.origin}/media/${g.id}/`;
      card.innerHTML = `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(g.name)}</div>
            <div class="meta">${g.fileCount} file${g.fileCount === 1 ? '' : 's'} · created ${new Date(g.createdAt).toLocaleDateString()}</div>
            <div class="link mono">${shareUrl}</div>
          </div>
          <div class="actions">
            <button class="small" onclick="copyLink('${shareUrl}', this)">Copy link</button>
            <button class="small danger" onclick="deleteGallery('${g.id}', '${escapeHtml(g.name)}')">Delete</button>
          </div>
        </div>
        <details>
          <summary>Upload files / manage contents</summary>
          <input type="file" multiple onchange="handleUpload('${g.id}', this)" />
          <div class="progress-wrap hidden" id="progress-${g.id}">
            <div class="file-progress-name mono" id="progress-name-${g.id}"></div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill-${g.id}"></div></div>
          </div>
          <div id="files-${g.id}" style="margin-top:1rem;"></div>
        </details>
      `;
      loadFileList(g.id);
      return card;
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function copyLink(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        const original = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = original, 1200);
      });
    }

    async function deleteGallery(id, name) {
      if (!confirm(`Delete "${name}" and all its files? This can't be undone.`)) return;
      await fetch(`/api/admin/galleries?id=${encodeURIComponent(id)}`, { method: 'DELETE', credentials: 'same-origin' });
      await refreshGalleries();
    }

    async function loadFileList(galleryId) {
      const res = await fetch(`/api/media/list?gallery=${encodeURIComponent(galleryId)}`, { credentials: 'same-origin' });
      const container = document.getElementById(`files-${galleryId}`);
      if (!res.ok) { container.innerHTML = ''; return; }
      const data = await res.json();
      container.innerHTML = '';
      data.files.forEach(f => {
        const row = document.createElement('div');
        row.className = 'file-row';
        row.innerHTML = `<span>${escapeHtml(f.key)} <span style="color:var(--dim)">(${formatSize(f.size)})</span></span>`;
        const delBtn = document.createElement('button');
        delBtn.className = 'small danger';
        delBtn.textContent = 'Remove';
        delBtn.onclick = async () => {
          await fetch(`/api/admin/file?gallery=${encodeURIComponent(galleryId)}&key=${encodeURIComponent(f.key)}`, { method: 'DELETE', credentials: 'same-origin' });
          loadFileList(galleryId);
          refreshGalleries();
        };
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }

    async function handleUpload(galleryId, input) {
      const files = [...input.files];
      input.value = '';
      const progressWrap = document.getElementById(`progress-${galleryId}`);
      const progressFill = document.getElementById(`progress-fill-${galleryId}`);
      const progressName = document.getElementById(`progress-name-${galleryId}`);
      progressWrap.classList.remove('hidden');

      for (const file of files) {
        progressName.textContent = `Uploading ${file.name}…`;
        progressFill.style.width = '0%';
        try {
          const urlRes = await fetch('/api/admin/upload-url', {
            method: 'POST', credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ gallery: galleryId, filename: file.name, contentType: file.type }),
          });
          const { uploadUrl } = await urlRes.json();
          await uploadWithProgress(uploadUrl, file, (pct) => { progressFill.style.width = pct + '%'; });
        } catch (e) {
          progressName.textContent = `Failed to upload ${file.name}`;
        }
      }
      progressName.textContent = 'Done';
      setTimeout(() => progressWrap.classList.add('hidden'), 1500);
      loadFileList(galleryId);
      refreshGalleries();
    }

    function uploadWithProgress(url, file, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', url);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) onProgress(Math.round((e.loaded / e.total) * 100));
        };
        xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('Upload failed'));
        xhr.onerror = () => reject(new Error('Upload failed'));
        xhr.send(file);
      });
    }

    checkExistingSession();
  </script>
</body>
</html>
